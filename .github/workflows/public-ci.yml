name: Public portable checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node tests/test_ui_contract.cjs
      - run: node tests/test_console_reliability.cjs
      - run: python3 -m py_compile brnestrm-gateway.py brnestrm_agent_runtime.py brnestrm_operational_health.py ops/backup-manager.py ops/health-alert-monitor.py ops/ops-status.py ops/recovery-key-escrow.py
      - run: python3 scripts/check_public_source.py
